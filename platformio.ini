[platformio]
; Default hardware: ESP32 DevKit with a JD9853 SPI TFT.
default_envs = esp32_jd9853
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test

[env:heltec_wifi_lora_32_V2]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino

lib_deps =
    olikraus/U8g2@^2.36.18
    bblanchon/ArduinoJson@^7.4.3
build_flags = -DCORE_DEBUG_LEVEL=3 -DTOKESP_BOARD_HELTEC_V2
monitor_speed = 115200
test_ignore = *

; ESP32 DevKit (ESP-WROOM-32) with a 4-pin I2C OLED module on SDA 21 / SCL 22.
; Add -DTOKESP_DISPLAY_SH1106 to build_flags if the panel turns out to be SH1106.
[env:esp32_i2c]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    olikraus/U8g2@^2.36.18
    bblanchon/ArduinoJson@^7.4.3
build_flags = -DCORE_DEBUG_LEVEL=3 -DTOKESP_BOARD_ESP32_I2C
monitor_speed = 115200
test_ignore = *

; ESP32 DevKit (ESP-WROOM-32) with a 240x296 JD9853 SPI TFT.
; SCK D18, MOSI D23, CS D5, DC D2, RST D4, VCC/BL 3V3.
[env:esp32_jd9853]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    olikraus/U8g2@^2.36.18
    bblanchon/ArduinoJson@^7.4.3
    bitbank2/AnimatedGIF@^2.2.0
    adafruit/Adafruit GFX Library@^1.12.4
build_flags = -DCORE_DEBUG_LEVEL=3 -DTOKESP_BOARD_ESP32_JD9853
board_build.embed_files =
    firmware/assets/agents_pixel_boot_296x240.gif
monitor_speed = 115200
test_ignore = *

; Host-side unit tests for the hardware-independent code in firmware/src/core.
[env:native]
platform = native
lib_deps = bblanchon/ArduinoJson@^7.4.3
build_src_filter = +<core/>
test_build_src = yes
build_flags = -std=c++17
